function Chip({ children, tone = "neutral", className }) {
  const tones = {
    neutral: "bg-zinc-800 text-zinc-300 ring-zinc-700",
    up: "bg-emerald-500/12 text-emerald-300 ring-emerald-500/25",
    down: "bg-red-500/12 text-red-300 ring-red-500/25",
    brand: "bg-orange-500/12 text-orange-300 ring-orange-500/25",
    info: "bg-sky-500/12 text-sky-300 ring-sky-500/25",
  };
  return (
    <span className={cn("inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium ring-1 ring-inset", tones[tone], className)}>
      {children}
    </span>
  );
}

function Stat({ label, value, hint, tone = "neutral" }) {
  const valueTone = {
    neutral: "text-zinc-100",
    up: "text-emerald-400",
    down: "text-red-400",
    brand: "text-orange-400",
  }[tone];
  return (
    <div className="rounded-lg border border-zinc-800 bg-zinc-900/60 px-3 py-2.5">
      <div className="text-[10px] font-medium uppercase tracking-wide text-zinc-500">{label}</div>
      <div className={cn("mt-1 text-lg font-semibold tabular-nums leading-none", valueTone)}>{value}</div>
      {hint ? <div className="mt-1 text-[10px] leading-tight text-zinc-500">{hint}</div> : null}
    </div>
  );
}

function Thumb({ className }) {
